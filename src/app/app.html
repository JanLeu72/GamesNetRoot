<div class="min-h-screen bg-slate-50 text-slate-900">
  <app-top-nav-bar />
  @if (updateReady()) {
    <div class="flex flex-wrap items-center justify-center gap-2 border-b border-slate-200 bg-white p-2">
      <span role="status">{{ 'header.update' | translate }}</span>
      <button type="button" class="rounded-md border border-slate-300 px-3 py-1"
              (click)="reloadForUpdate()">{{ 'header.reload' | translate }}</button>
    </div>
  }
  <main class="mx-auto max-w-5xl px-4 py-2 sm:px-6">
    <router-outlet />
  </main>
  @defer (when shouldAskForPlayerName()) {
    @if (shouldAskForPlayerName()) {
      <app-player-name-dialog (dismissed)="dismissedNamePrompt.set(true)" />
    }
  }
</div>
