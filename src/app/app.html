<div class="min-h-screen bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-4 sm:px-6">
      <a routerLink="/" class="font-semibold">NetRoot Games</a>
      @if (currentUser(); as user) {
        <div class="flex min-w-0 flex-wrap items-center gap-3 text-sm">
          <span class="break-all">{{ user.username }}</span>
          <button type="button" class="rounded-md border border-slate-300 px-3 py-1.5 hover:bg-slate-100" [disabled]="signingOut()" (click)="logout()">
            Abmelden
          </button>
          @if (logoutError()) {
            <span role="alert">Die Abmeldung ist momentan nicht möglich. Versuche es erneut.</span>
          }
        </div>
      }
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6">
    <router-outlet />
  </main>
</div>
