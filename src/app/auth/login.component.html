<section class="login-card">
  <h1>{{ 'login.title' | translate }}</h1>
  <p class="login-intro">{{ 'login.intro' | translate }}</p>

  <form [formGroup]="form" (ngSubmit)="login()">
    <div>
      <label for="username">{{ 'login.username' | translate }}</label>
      <input
        id="username"
        formControlName="username"
        autocomplete="username"
        required
        [readOnly]="pending()"
      />
    </div>
    <div>
      <label for="password">{{ 'login.password' | translate }}</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required
        [readOnly]="pending()"
      />
    </div>
    @if (error()) {
      <p role="alert" class="login-error">{{ error() | translate }}</p>
    }
    <button
      type="submit"
      [disabled]="form.invalid || pending()"
    >
      {{ (pending() ? 'login.pending' : 'login.submit') | translate }}
    </button>
  </form>

  <div class="login-links">
    <a href="https://www.netroot.ch/user/create">{{ 'login.register' | translate }}</a>
    <a href="https://www.netroot.ch/user/forgot-password">{{ 'login.forgot' | translate }}</a>
  </div>
</section>
